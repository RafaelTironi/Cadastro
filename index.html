<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">
    <title>Bootstrap Example</title>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="p-3 m-0 border-0 bd-example m-0 border-0">
    <div>
        <form class="row g-3">
            <div class="col-md-6">
                <label for="inputNome" class="form-label">Nome Completo</label>
                <input type="text" class="form-control" id="inputNome">
            </div>
            <div class="col-md-6">
                <label for="inputCpf" class="form-label">CPF</label>
                <input type="text" class="form-control" id="inputCpf">
            </div>
            <div class="col-md-4">
                <label for="inputNasc" class="form-label">Data de Nascimento</label>
                <input type="date" class="form-control" id="inputNasc" placeholder="DD/MM/AAAA">
            </div>
            <div class="col-md-4">
                <label for="inputTel" class="form-label">Telefone</label>
                <input type="tel" class="form-control" id="inputTel" placeholder="(XX) XXXXX-XXXX">
            </div>
            <div class="col-md-4">
                <label for="inputEmail" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="inputEmail" placeholder="email@example.com">
            </div>
            <div class="col-md-12">
                <label for="inputEndereco" class="form-label">Endereço</label>
                <input type="text" class="form-control" id="inputEndereco">
            </div>
            <div class="col-md-4">
                <label for="inputCity" class="form-label">Cidade</label>
                <input type="text" class="form-control" id="inputCity">
            </div>
            <div class="col-md-4">
                <label for="inputState" class="form-label">Estado</label>
                <select id="inputState" class="form-select">
                    <option selected="">Selecione Seu Estado</option>
                    <option>AC</option>
                    <option>AL</option>
                    <option>AM</option>
                    <option>AP</option>
                    <option>BA</option>
                    <option>CE</option>
                    <option>DF</option>
                    <option>ES</option>
                    <option>GO</option>
                    <option>MA</option>
                    <option>MG</option>
                    <option>MS</option>
                    <option>MT</option>
                    <option>PA</option>
                    <option>PB</option>
                    <option>PE</option>
                    <option>PI</option>
                    <option>PR</option>
                    <option>RJ</option>
                    <option>RN</option>
                    <option>RO</option>
                    <option>RR</option>
                    <option>RS</option>
                    <option>SC</option>
                    <option>SE</option>
                    <option>SP</option>
                    <option>TO</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="inputZip" class="form-label">CEP</label>
                <input type="text" class="form-control" id="inputZip">
            </div>
            <div class="col-md-6">
                <label for="inputCurso" class="form-label">Curso</label>
                <input type="text" class="form-control" id="inputCurso" placeholder="Nome do Curso">
            </div>
            <div class="col-md-6">
                <label for="inputMatricula" class="form-label">Matrícula</label>
                <input type="text" class="form-control" id="inputMatricula">
            </div>
            <div class="col-md-6">
                <label for="inputSenha" class="form-label">Senha</label>
                <input type="text" class="form-control" id="inputSenha" placeholder="Digite sua Senha">
            </div>
            <div class="col-md-6">
                <label for="inputConfirmarSenha" class="form-label">Confirmar Senha</label>
                <input type="text" class="form-control" id="inputConfirmarSenha">
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-primary">Cadastrar</button>
            </div>
        </form>
    </div>
</body>

</html>
