<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">
    <title>Bootstrap Example</title>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="cadastro.css">

</head>

<body class="p-3 m-0 border-0 bd-example m-0 border-0">
    <main>
        <div class="card-form">
            <h3 class="text-center mb-2">Cadastro de Aluno</h3>
            <p class="text-center text-muted mb-4">
                Preencha os dados abaixo para realizar o registro completo do aluno no sistema acadêmico.
            </p>

            <form class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Nome Completo</label>
                    <input type="text" class="form-control" id="inputNome">
                </div>

                <div class="col-md-6">
                    <label class="form-label">CPF</label>
                    <input type="text" class="form-control" id="inputCpf">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Data de Nascimento</label>
                    <input type="date" class="form-control" id="inputNasc">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Telefone</label>
                    <input type="tel" class="form-control" id="inputTel">
                </div>

                <div class="col-md-4">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="inputEmail">
                </div>

                <div class="col-12">
                    <label class="form-label">Endereço Completo</label>
                    <input type="text" class="form-control" id="inputEndereco">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Cidade</label>
                    <input type="text" class="form-control" id="inputCity">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Estado</label>
                    <select class="form-select" id="inputState">
                        <option selected>Selecione Seu Estado</option>
                        <option>AC</option>
                        <option>AL</option>
                        <option>AM</option>
                        <option>AP</option>
                        <option>BA</option>
                        <option>CE</option>
                        <option>DF</option>
                        <option>ES</option>
                        <option>GO</option>
                        <option>MA</option>
                        <option>MG</option>
                        <option>MS</option>
                        <option>MT</option>
                        <option>PA</option>
                        <option>PB</option>
                        <option>PE</option>
                        <option>PI</option>
                        <option>PR</option>
                        <option>RJ</option>
                        <option>RN</option>
                        <option>RO</option>
                        <option>RR</option>
                        <option>RS</option>
                        <option>SC</option>
                        <option>SE</option>
                        <option>SP</option>
                        <option>TO</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">CEP</label>
                    <input type="text" class="form-control" id="inputZip">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Curso</label>
                    <input type="text" class="form-control" id="inputCurso">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Matrícula</label>
                    <input type="text" class="form-control" id="inputMatricula">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Senha</label>
                    <input type="password" class="form-control" id="inputSenha">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Confirmar Senha</label>
                    <input type="password" class="form-control" id="inputConfirmarSenha">
                </div>

                <div class="col-12 mt-3">
                    <button type="submit" class="btn btn-primary btn-full">
                        Cadastrar Aluno
                    </button>
                </div>

            </form>
        </div>
        <script src="cadastro.js"></script>
    </main>
</body>

</html>
